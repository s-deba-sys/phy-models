<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Physics Simulations by DS</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --tag-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2.5rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Controls: Search and Filters */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-bar {
      width: 100%;
      padding: 0.85rem 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      background: var(--tag-bg);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-color: var(--accent);
    }

    /* Grid layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .card-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 0.6rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.2rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.2rem;
    }

    .tag {
      font-size: 0.75rem;
      background: var(--tag-bg);
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .launch-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      text-decoration: none;
      color: #000;
      background: var(--accent);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .launch-link:hover {
      background: var(--accent-hover);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <h1>Physics Lab Hub by Debashis Shivamangal</h1>
    <p>Curated interactive simulations, visualizations, and digital laboratories.</p>
  </header>

  <section class="controls">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search simulations by name, topic, or keyword...">
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="Mechanics">Mechanics</button>
      <button class="filter-btn" data-filter="Electromagnetism">Electromagnetism</button>
      <button class="filter-btn" data-filter="Thermodynamics">Thermodynamics</button>
      <button class="filter-btn" data-filter="Optics & Waves">Optics & Waves</button>
      <button class="filter-btn" data-filter="Quantum & Astro">Quantum & Astro</button>
    </div>
  </section>

  <main class="grid" id="simulationsGrid"></main>

  <script>
    // Edit or add your simulation links here
    // In your index.html, replace the simulations array with this:
    const simulations = [
      {
        title: "Lorentz Particle Simulation",
        category: "Electromagnetism",
        description: "Interactive visualizer for charged particle dynamics in combined electric and magnetic fields (Lorentz force: F = q(E + v × B)).",
        tags: ["Lorentz Force", "Electrodynamics", "Magnetic Fields", "Trajectories"],
        url: "https://s-deba-sys.github.io/phy-models/lorentz_particle_simulation.html"
      },
      {
        title: "Projectile Motion",
        category: "Mechanics",
        description: "Explore kinematics, launch angles, velocity vectors, and drag coefficients.",
        tags: ["Gravity", "Vectors", "Kinematics"],
        url: "https://phet.colorado.edu/en/simulations/projectile-motion"
      },
      {
        title: "Double Pendulum Chaos",
        category: "Mechanics",
        description: "Real-time non-linear dynamics visualizer demonstrating sensitive dependence on initial conditions.",
        tags: ["Chaos", "Lagrangian", "Oscillation"],
        url: "https://myphysicslab.com/pendulum/double-pendulum-en.html"
      },
      {
        title: "Wave Interference & Diffraction",
        category: "Optics & Waves",
        description: "Simulate double-slit experiments, wave reflection, barriers, and Doppler shifts.",
        tags: ["Interference", "Young's Slits", "Huygens"],
        url: "https://falstad.com/ripple/"
      }
    ];

    const grid = document.getElementById("simulationsGrid");
    const searchInput = document.getElementById("searchInput");
    const filterButtons = document.querySelectorAll(".filter-btn");

    let currentCategory = "all";
    let searchQuery = "";

    function renderSimulations() {
      grid.innerHTML = "";

      const filtered = simulations.filter(sim => {
        const matchesCat = currentCategory === "all" || sim.category === currentCategory;
        const matchesSearch = sim.title.toLowerCase().includes(searchQuery) ||
                              sim.description.toLowerCase().includes(searchQuery) ||
                              sim.tags.some(tag => tag.toLowerCase().includes(searchQuery));
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem 0;">No simulations found matching your criteria.</p>`;
        return;
      }

      filtered.forEach(sim => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="card-category">${sim.category}</div>
            <h2>${sim.title}</h2>
            <p>${sim.description}</p>
          </div>
          <div>
            <div class="tags">
              ${sim.tags.map(t => `<span class="tag">#${t}</span>`).join("")}
            </div>
            <a href="${sim.url}" target="_blank" rel="noopener noreferrer" class="launch-link">
              Launch Simulation &rarr;
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderSimulations();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.getAttribute("data-filter");
        renderSimulations();
      });
    });

    renderSimulations();
  </script>
</body>
</html>
