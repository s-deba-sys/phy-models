<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charged Particle in a Magnetic Field - 3D Lorentz Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for interactive POV manipulation -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            background-color: #030712;
            color: #f3f4f6;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Slider Accent Styling */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #1f2937;
            border-radius: 9999px;
            border: 1px solid #374151;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.7), 0 0 0 2px #0f172a;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #7dd3fc;
        }
    </style>
</head>

<body class="relative w-screen h-screen m-0 p-0">

    <!-- WebGL 3D Container -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing"></div>

    <!-- Header Overlay (Top Left) -->
    <div class="absolute top-4 left-4 sm:top-6 sm:left-6 z-20 max-w-sm sm:max-w-md">
        <div class="bg-gray-900/85 backdrop-blur-md border border-gray-800 p-4 rounded-2xl shadow-2xl">
            <div class="flex items-center justify-between gap-2 mb-2 pb-2 border-b border-gray-800">
               
                <span class="text-xs font-semibold tracking-wider uppercase text-cyan-400 mono">Lorentz Force Dynamics</span>
            </div>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white mb-1">
                Charged Particle in Uniform <span class="text-sky-400">B&#8407;</span> Field
            </h1>
        </div>
    </div>

    <!-- Legend Overlay (Top Right) -->
    <div class="absolute top-4 right-4 sm:top-6 sm:right-6 z-10 hidden md:block pointer-events-none">
        <div class="bg-gray-900/85 backdrop-blur-md border border-gray-800 p-3.5 rounded-2xl text-xs space-y-2.5 shadow-2xl">
            <div class="flex items-center gap-2.5">
                <span class="w-4 h-1 rounded bg-rose-500 shadow-[0_0_8px_#f43f5e]"></span>
                <span class="text-gray-300">Actual Trajectory (<span class="mono">q &gt; 0</span>)</span>
            </div>
            <div class="flex items-center gap-2.5">
                <span class="w-4 h-0 border-t-2 border-dashed border-amber-400"></span>
                <span class="text-gray-300">Ghost Path (Undeflected <span class="mono">v&#8407;&#8320;</span>)</span>
            </div>
            <div class="flex items-center gap-2.5">
                <span class="w-4 h-1 rounded bg-sky-400 shadow-[0_0_8px_#38bdf8]"></span>
                <span class="text-gray-300">Magnetic Field Vectors (<span class="mono">+Z axis</span>)</span>
            </div>
        </div>
    </div>

    <!-- Primary Slider Controller (Bottom Floating Panel) -->
    <div class="absolute bottom-5 inset-x-4 sm:inset-x-auto sm:left-1/2 sm:-translate-x-1/2 z-20 max-w-xl sm:w-full">
        <div class="bg-gray-900/90 backdrop-blur-xl border border-gray-700/80 p-5 rounded-3xl shadow-2xl flex flex-col sm:flex-row items-center gap-4">
            <div class="flex items-center justify-between w-full sm:w-auto gap-3">
                <label for="theta-slider" class="text-xs uppercase font-bold tracking-wider text-gray-300 whitespace-nowrap">
                    Pitch Angle (&theta;)
                </label>
                <span id="theta-badge" class="mono text-sm px-3 py-1 bg-cyan-950 text-cyan-300 border border-cyan-700/60 rounded-xl font-bold shadow-inner min-w-[62px] text-center">
                    45.0&deg;
                </span>
            </div>

            <!-- The Single Controlled Variable -->
            <div class="w-full flex items-center gap-3">
                <span class="text-xs font-bold text-gray-500 mono">0&deg;</span>
                <input id="theta-slider" type="range" min="0" max="90" step="0.5" value="45" class="w-full" aria-label="Pitch angle theta between initial velocity and magnetic field" />
                <span class="text-xs font-bold text-gray-500 mono">90&deg;</span>
            </div>

            <!-- Quick Preset buttons -->
            <div class="flex items-center gap-1.5 w-full sm:w-auto justify-end border-t sm:border-t-0 sm:border-l border-gray-800 pt-2 sm:pt-0 sm:pl-3">
                <button onclick="setTheta(0)" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 font-medium transition">
                    0&deg;
                </button>
                <button onclick="setTheta(45)" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 font-medium transition">
                    45&deg;
                </button>
                <button onclick="setTheta(90)" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 font-medium transition">
                    90&deg;
                </button>
            </div>
        </div>
    </div>

    <script>
        /* Global simulation state */
        const CONFIG = {
            vTotal: 25.0,
            omega: 2.5,
            ghostLength: 85.0,
            trailResolution: 600,
            timeScale: 1.0,
        };

        let thetaDeg = 45.0;
        let simTime = 0.0;

        // Three.js Core components
        const container = document.getElementById("canvas-container");
        const scene = new THREE.Scene();

        // Removed dense exponential fog that was darkening the entire scene
        scene.fog = null;

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(45, 32, 50);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 250;
        controls.minDistance = 10;
        controls.target.set(0, 0, 20);

        // Boosted Lights so objects pop brightly against the deep background
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(30, 50, 20);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xf43f5e, 3.5, 60);
        scene.add(pointLight);

        // Reference Grid
        const gridHelper = new THREE.GridHelper(90, 30, 0x374151, 0x1f2937);
        gridHelper.position.set(0, -12, 20);
        scene.add(gridHelper);

        // Vibrant 3D arrows depicting uniform B-field pointing along +Z axis
        const bFieldGroup = new THREE.Group();
        const arrowDir = new THREE.Vector3(0, 0, 1).normalize();
        const arrowLength = 9;
        const arrowColor = 0x38bdf8; // Bright Electric Cyan

        for (let x = -16; x <= 16; x += 8) {
            for (let y = -8; y <= 16; y += 8) {
                for (let z = -15; z <= 55; z += 18) {
                    const arrowOrigin = new THREE.Vector3(x, y, z);
                    const arrowHelper = new THREE.ArrowHelper(
                        arrowDir,
                        arrowOrigin,
                        arrowLength,
                        arrowColor,
                        2.2,
                        1.2
                    );
                    arrowHelper.line.material.transparent = true;
                    arrowHelper.line.material.opacity = 0.45;
                    arrowHelper.line.material.fog = false;

                    arrowHelper.cone.material.transparent = true;
                    arrowHelper.cone.material.opacity = 0.85;
                    arrowHelper.cone.material.fog = false;
                    bFieldGroup.add(arrowHelper);
                }
            }
        }
        scene.add(bFieldGroup);

        // Origin marker
        const originGeo = new THREE.SphereGeometry(0.4, 16, 16);
        const originMat = new THREE.MeshBasicMaterial({
            color: 0x94a3b8,
            wireframe: true
        });
        const originMesh = new THREE.Mesh(originGeo, originMat);
        originMesh.position.set(0, 0, 0);
        scene.add(originMesh);

        // 1. Ghost Line (Undeflected v0)
        const ghostPointsCount = 80;
        const ghostGeometry = new THREE.BufferGeometry();
        const ghostPositions = new Float32Array(ghostPointsCount * 3);
        ghostGeometry.setAttribute("position", new THREE.BufferAttribute(ghostPositions, 3));

        const ghostMaterial = new THREE.LineDashedMaterial({
            color: 0xfbbf24,
            linewidth: 2.5,
            scale: 1,
            dashSize: 1.2,
            gapSize: 0.8,
            transparent: true,
            opacity: 0.95
        });
        const ghostLine = new THREE.Line(ghostGeometry, ghostMaterial);
        ghostLine.computeLineDistances();
        scene.add(ghostLine);

        // Ghost path tip cone
        const ghostConeGeo = new THREE.ConeGeometry(0.7, 2.0, 16);
        const ghostConeMat = new THREE.MeshBasicMaterial({
            color: 0xfbbf24
        });
        const ghostCone = new THREE.Mesh(ghostConeGeo, ghostConeMat);
        scene.add(ghostCone);

        // 2. Charged Particle (Glowing Bright Neon Red/Pink)
        const particleGeometry = new THREE.SphereGeometry(1.1, 32, 32);
        const particleMaterial = new THREE.MeshStandardMaterial({
            color: 0xff2d55,
            emissive: 0xff2d55,
            emissiveIntensity: 1.2,
            roughness: 0.1,
            metalness: 0.2
        });
        const particleMesh = new THREE.Mesh(particleGeometry, particleMaterial);
        scene.add(particleMesh);

        // Particle Outer Glow Shell
        const glowGeo = new THREE.SphereGeometry(1.8, 24, 24);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0xfb7185,
            transparent: true,
            opacity: 0.45,
            wireframe: true
        });
        const glowMesh = new THREE.Mesh(glowGeo, glowMat);
        particleMesh.add(glowMesh);

        // 3. Dynamic Curved Trajectory Trail
        const maxTrailPoints = CONFIG.trailResolution;
        const trailPositions = new Float32Array(maxTrailPoints * 3);
        const trailColors = new Float32Array(maxTrailPoints * 3);

        const trailGeometry = new THREE.BufferGeometry();
        trailGeometry.setAttribute("position", new THREE.BufferAttribute(trailPositions, 3));
        trailGeometry.setAttribute("color", new THREE.BufferAttribute(trailColors, 3));

        const trailMaterial = new THREE.LineBasicMaterial({
            vertexColors: true,
            linewidth: 3,
            transparent: true,
            opacity: 1.0
        });
        const trailLine = new THREE.Line(trailGeometry, trailMaterial);
        scene.add(trailLine);

        let trailHistory = [];

        function updateGhostLine() {
            const rad = (thetaDeg * Math.PI) / 180.0;
            const dirX = Math.sin(rad);
            const dirY = 0.0;
            const dirZ = Math.cos(rad);

            const positions = ghostGeometry.attributes.position.array;
            const totalLen = CONFIG.ghostLength;

            for (let i = 0; i < ghostPointsCount; i++) {
                const t = (i / (ghostPointsCount - 1)) * totalLen;
                positions[i * 3] = dirX * t;
                positions[i * 3 + 1] = dirY * t;
                positions[i * 3 + 2] = dirZ * t;
            }
            ghostGeometry.attributes.position.needsUpdate = true;
            ghostLine.computeLineDistances();

            const endX = dirX * totalLen;
            const endY = 0;
            const endZ = dirZ * totalLen;
            ghostCone.position.set(endX, endY, endZ);

            const targetVec = new THREE.Vector3(dirX, dirY, dirZ).normalize();
            ghostCone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), targetVec);
        }

        function getLorentzPosition(t, rad) {
            const vPerp = CONFIG.vTotal * Math.sin(rad);
            const vPar = CONFIG.vTotal * Math.cos(rad);
            const r = CONFIG.omega > 0.0001 ? vPerp / CONFIG.omega : 0;

            const x = r * Math.sin(CONFIG.omega * t);
            const y = r * (1.0 - Math.cos(CONFIG.omega * t));
            const z = vPar * t;

            return { x, y, z };
        }

        const thetaBadge = document.getElementById("theta-badge");
        const thetaSlider = document.getElementById("theta-slider");

        function resetParticleCycle() {
            simTime = 0.0;
            trailHistory = [];
            const posAttr = trailGeometry.attributes.position;
            const colAttr = trailGeometry.attributes.color;
            for (let i = 0; i < maxTrailPoints * 3; i++) {
                posAttr.array[i] = 0;
                colAttr.array[i] = 0;
            }
            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;
        }

        function onThetaChange(newTheta) {
            thetaDeg = parseFloat(newTheta);
            thetaSlider.value = thetaDeg;
            thetaBadge.textContent = Number(thetaDeg).toFixed(1) + "°";
            updateGhostLine();
            resetParticleCycle();
        }

        function setTheta(val) {
            onThetaChange(val);
        }

        thetaSlider.addEventListener("input", (e) => {
            onThetaChange(e.target.value);
        });

        let lastClock = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const deltaSec = Math.min((now - lastClock) / 1000, 0.1);
            lastClock = now;

            simTime += deltaSec * CONFIG.timeScale;

            const rad = (thetaDeg * Math.PI) / 180.0;
            const state = getLorentzPosition(simTime, rad);

            particleMesh.position.set(state.x, state.y, state.z);
            pointLight.position.set(state.x, state.y, state.z);

            trailHistory.push(new THREE.Vector3(state.x, state.y, state.z));

            const maxZReach = 75;
            const isCircularLooping = (thetaDeg >= 89.5 && simTime > (Math.PI * 6) / CONFIG.omega);
            if (state.z > maxZReach || isCircularLooping) {
                resetParticleCycle();
            }

            if (trailHistory.length > maxTrailPoints) {
                trailHistory.shift();
            }

            const positions = trailGeometry.attributes.position.array;
            const colors = trailGeometry.attributes.color.array;
            const count = trailHistory.length;

            for (let i = 0; i < maxTrailPoints; i++) {
                const idx = i * 3;
                if (i < count) {
                    const pt = trailHistory[i];
                    positions[idx] = pt.x;
                    positions[idx + 1] = pt.y;
                    positions[idx + 2] = pt.z;

                    // Vivid color progression: from deep glowing crimson to brilliant hot-pink head
                    const progress = i / count;
                    colors[idx] = 0.85 * progress + 0.15;
                    colors[idx + 1] = 0.35 * progress;
                    colors[idx + 2] = 0.55 * progress + 0.1;
                } else if (count > 0) {
                    const last = trailHistory[0];
                    positions[idx] = last.x;
                    positions[idx + 1] = last.y;
                    positions[idx + 2] = last.z;
                    colors[idx] = 0;
                    colors[idx + 1] = 0;
                    colors[idx + 2] = 0;
                }
            }
            trailGeometry.attributes.position.needsUpdate = true;
            trailGeometry.attributes.color.needsUpdate = true;
            trailGeometry.setDrawRange(0, count);

            const pulse = 1.0 + Math.sin(now * 0.006) * 0.25;
            glowMesh.scale.set(pulse, pulse, pulse);

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = function() {
            updateGhostLine();
            animate();
        };
    </script>
</body>

</html>
